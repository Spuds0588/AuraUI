<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AuraUI">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="1" stop-color="#161d36" />
    </linearGradient>
  </defs>
  <!-- Full bleed, so the same file works as a maskable icon and as a Home Screen tile. -->
  <rect width="512" height="512" fill="url(#tile)" />
  <!-- The ring is the question on screen; the dot is the person it is waiting on. -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#7c6aeb" stroke-width="40" />
  <circle cx="364" cy="348" r="34" fill="#06b0d1" />
</svg>
